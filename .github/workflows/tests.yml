name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: MANDATE_LLM_DISABLE=1 python -m unittest discover -t . -s tests
      - run: MANDATE_LLM_DISABLE=1 python -m mandate.live_check --emulator
